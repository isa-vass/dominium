<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominium - Victory</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121827;
        }

        .victory-box {
            width: min(660px, 100%);
            padding: 32px;
            border-radius: 18px;
            background: rgba(11, 20, 39, 0.96);
            border: 1px solid rgba(255, 68, 68, 0.18);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            color: #e8e8f0;
            text-align: center;
        }

        .victory-box h1 {
            margin-bottom: 10px;
            font-size: 3rem;
            letter-spacing: 0.2em;
            color: #ff4444;
            text-transform: uppercase;
            font-family: 'Cinzel Decorative', Georgia, serif;
        }

        .victory-subtitle {
            margin-bottom: 24px;
            color: #f5f5f5;
            font-size: 1.05rem;
            opacity: 0.85;
            line-height: 1.6;
        }

        .result-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0 auto 26px;
            padding: 16px 22px;
            border-radius: 999px;
            background: rgba(255, 68, 68, 0.12);
            color: #ffbbbb;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-badge.win {
            background: rgba(34, 197, 94, 0.16);
            color: #a7f3d0;
        }

        .ranking-list {
            display: grid;
            gap: 12px;
            margin-bottom: 28px;
            text-align: left;
        }

        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            padding: 16px 20px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .ranking-item.top {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }

        .ranking-item.defeated {
            opacity: 0.6;
            border-color: rgba(220, 38, 38, 0.2);
        }

        .ranking-name {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
        }

        .ranking-score {
            font-size: 0.95rem;
            color: #cbd5e1;
            min-width: 108px;
            text-align: right;
        }

        .ranking-result {
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 6px 12px;
            border-radius: 999px;
        }

        .ranking-result.win {
            color: #16a34a;
            background: rgba(22, 163, 74, 0.12);
        }

        .ranking-result.lose {
            color: #db2777;
            background: rgba(220, 38, 38, 0.12);
        }

        .ranking-result.eliminated {
            color: #94a3b8;
            background: rgba(100, 116, 139, 0.15);
        }

        #victory-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-small {
            min-width: 170px;
            padding: 14px 20px;
            border-radius: 10px;
            border: 2px solid #ff4444;
            background: linear-gradient(135deg, #8b0000 0%, #ff0000 45%, #8b0000 100%);
            color: #fff;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="victory-box">
        <h1>Final Ranking</h1>
        <div class="result-badge" id="result-badge">Wait...</div>
        <p class="victory-subtitle" id="result-reason">Loading game results...</p>

        <div class="ranking-list" id="ranking-list">
            <div class="ranking-item">
                <div class="ranking-name">Loading...</div>
                <div class="ranking-score">—</div>
            </div>
        </div>

        <div id="victory-actions">
            <button class="btn-small" id="btn-home">Back to Lobby</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('id');
        const storageKey = 'dominiumGameResults';
        const rankingList = document.getElementById('ranking-list');
        const resultBadge = document.getElementById('result-badge');
        const resultReason = document.getElementById('result-reason');
        const btnHome = document.getElementById('btn-home');

        btnHome.addEventListener('click', () => {
            sessionStorage.removeItem(storageKey);
            window.location.href = '/view/action.html';
        });

        function renderResults(data) {
            if (!data || !Array.isArray(data.results.players)) {
                resultBadge.textContent = 'Error';
                resultReason.textContent = 'Unable to load the game ranking.';
                rankingList.innerHTML = '';
                return;
            }

            const players = data.results.players;
            if (players.length === 0) {
                resultBadge.textContent = 'No results';
                resultReason.textContent = 'There are no valid players for this game.';
                rankingList.innerHTML = '';
                return;
            }

            const reason = data.results.reason;
            const currentName = sessionStorage.getItem('playerName');

            // Determine if current player won
            // players[0] is always the top-ranked
            const isWinner = currentName && players[0]?.name === currentName;

            if (reason === 'conquest') {
                resultBadge.textContent = isWinner ? 'Victory!' : 'Defeat';
                if (isWinner) resultBadge.classList.add('win');
                resultReason.textContent = reason === 'conquest'
                    ? `${players[0].name} has conquered all regions!`
                    : '';
            } else {
                // time
                resultBadge.textContent = 'Game Over';
                resultReason.textContent = 'The game has ended due to time expiration.';
            }

            rankingList.innerHTML = '';
            const medals = ['🥇', '🥈', '🥉', '4️⃣'];

            players.forEach((player, index) => {
                const item = document.createElement('div');
                const isTop = index === 0;
                const isEliminated = player.defeatedAt !== null && player.defeatedAt !== undefined;
                item.className = `ranking-item${isTop ? ' top' : ''}${isEliminated ? ' defeated' : ''}`;

                const label = document.createElement('div');
                label.className = 'ranking-name';
                const isMe = currentName && player.name === currentName;
                label.textContent = `${medals[index] || (index + 1) + '.'} ${player.name}${isMe ? ' (tu)' : ''}`;

                const meta = document.createElement('div');
                meta.style.display = 'flex';
                meta.style.alignItems = 'center';
                meta.style.gap = '12px';

                const score = document.createElement('div');
                score.className = 'ranking-score';

                if (isEliminated) {
                    score.textContent = 'Eliminated';
                } else {
                    score.textContent = `${player.provinces} region${player.provinces !== 1 ? 's' : 'e'}`;
                }

                const status = document.createElement('div');

                if (isEliminated) {
                    status.className = 'ranking-result eliminated';
                    status.textContent = 'Eliminated';
                } else if (reason === 'conquest' && isTop) {
                    status.className = 'ranking-result win';
                    status.textContent = 'Victory';
                } else if (reason === 'time') {
                    // For time-based: show position only, no win/lose label
                    status.className = 'ranking-result';
                    status.style.color = '#94a3b8';
                    status.style.background = 'rgba(100,116,139,0.1)';
                    status.textContent = `${index + 1}° posto`;
                } else {
                    status.className = 'ranking-result lose';
                    status.textContent = 'Defeat';
                }

                meta.appendChild(score);
                meta.appendChild(status);
                item.appendChild(label);
                item.appendChild(meta);
                rankingList.appendChild(item);
            });
        }

        function loadCachedResults() {
            try {
                const raw = sessionStorage.getItem(storageKey);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || parsed.roomId !== roomId) return null;
                return parsed;
            } catch (e) {
                return null;
            }
        }

        const cached = loadCachedResults();
        if (cached) {
            renderResults(cached);
        } else if (roomId) {
            socket.emit('request_game_results', { roomId });
        }

        socket.on('game_results', ({ results }) => {
            if (!results) return;
            const payload = { roomId, results };
            sessionStorage.setItem(storageKey, JSON.stringify(payload));
            renderResults(payload);
        });

        socket.on('connect_error', () => {
            resultReason.textContent = 'Connection to server lost. Please try again in a few seconds.';
        });
    </script>
</body>

</html>
