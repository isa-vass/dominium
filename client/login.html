<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominium – Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./config/style.css">
    <style>
        /* ── AGGIUNTE SPECIFICHE PER LOGIN ── */

        body {
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            display: flex;
            background: #000000 !important;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
            animation: fadeIn 0.8s ease-in;
            position: relative;
            z-index: 1;
        }

        /* Titolo con stile header del gioco */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            font-family: 'Cinzel', 'Georgia', serif;
            font-size: 3em;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #1a0000 0%, #4a0000 50%, #1a0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
            text-align: center;
            color: #ff4444;
            margin-bottom: 40px;
            text-shadow:
                0 0 10px rgba(255, 0, 0, 0.5),
                0 0 20px rgba(139, 0, 0, 0.3),
                2px 2px 4px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .login-header .subtitle {
            font-size: 0.8em;
            color: rgba(255, 204, 204, 0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-style: italic;
        }

        /* Card login */
        .login-card {
            background: linear-gradient(145deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 3px solid #8b0000;
            border-radius: 15px;
            padding: 36px 40px 40px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 68, 68, 0.15),
                0 0 30px rgba(139, 0, 0, 0.25);
            position: relative;
        }

        /* spada decorativa in cima alla card */
        .login-card::before {
            content: '⚔';
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: #0d0d0d;
            padding: 0 10px;
            color: #8b0000;
            font-size: 1.2em;
            line-height: 1;
        }

        /* Tab accedi / registrati */
        .tabs {
            display: flex;
            margin-bottom: 28px;
            border-bottom: 2px solid rgba(139, 0, 0, 0.4);
            gap: 0;
        }

        .tab {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Cinzel', 'Georgia', serif;
            font-size: 0.78em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 204, 204, 0.35);
            transition: color 0.2s;
        }

        .tab.active {
            color: #ff4444;
            border-bottom: 2px solid #ff4444;
            margin-bottom: -2px;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
        }

        /* Sezioni form */
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        /* Label e input */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-family: 'Cinzel', 'Georgia', serif;
            font-size: 0.65em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 204, 204, 0.45);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(139, 0, 0, 0.5);
            border-radius: 8px;
            color: #ffcccc;
            font-family: 'Cinzel', 'Georgia', serif;
            font-size: 0.88em;
            letter-spacing: 1px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus {
            border-color: #ff4444;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(255, 204, 204, 0.2);
            font-size: 0.9em;
        }

        /* Submit button — usa .btn .btn-primary già in style.css */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: 2px solid #8b0000;
            border-radius: 8px;
            background: linear-gradient(135deg, #8b0000 0%, #ff0000 50%, #8b0000 100%);
            color: #ffffff;
            font-family: 'Cinzel', 'Georgia', serif;
            font-size: 0.85em;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .submit-btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 0, 0, 0.7);
            border-color: #ff4444;
        }

        /* Messaggio errore */
        .alert-error {
            background: rgba(139, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.35);
            color: #ff6666;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 0.75em;
            letter-spacing: 1px;
            text-align: center;
            display: none;
        }

        .alert-error.visible {
            display: block;
        }

        /* Separatore dentro la card */
        .card-divider {
            height: 1px;
            background: rgba(139, 0, 0, 0.25);
            margin: 0 0 24px;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">

        <!-- Titolo stile gioco -->
        <div class="login-header">
            <h1>Dominium</h1>
            <p class="subtitle">Conquerr the world</p>
        </div>

        <div class="login-card">

            <!-- Tab selector -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab(event, 'login')">Login</button>
                <button class="tab" onclick="switchTab(event, 'register')">Register</button>
            </div>

            <div class="card-divider"></div>

            <!-- LOGIN -->
            <div class="form-section active" id="section-login">
                <div class="alert-error" id="error-login"></div>
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="Enter your email" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password"
                        autocomplete="current-password">
                </div>
                <button class="submit-btn" onclick="doLogin()">Login</button>
            </div>

            <!-- REGISTRAZIONE -->
            <div class="form-section" id="section-register">
                <div class="alert-error" id="error-register"></div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" placeholder="Enter your email" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="Choose a password (min. 6 characters)"
                        autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="reg-password2">Confirm Password</label>
                    <input type="password" id="reg-password2" placeholder="Repeat the password"
                        autocomplete="new-password">
                </div>
                <button class="submit-btn" onclick="doRegister()">Register</button>
            </div>

        </div>
    </div>

    <script>
        function switchTab(event, tab) {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            document.querySelectorAll(".form-section").forEach(s => s.classList.remove("active"));
            document.getElementById("section-" + tab).classList.add("active");
            event.target.classList.add("active");
        }

        function showError(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.classList.add("visible");
        }

        function hideError(id) {
            document.getElementById(id).classList.remove("visible");
        }

        async function doLogin() {
            hideError("error-login");
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value.trim();

            if (!email || !password) {
                showError("error-login", "Inserisci email e password");
                return;
            }

            try {
                const res = await fetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!data.success) {
                    showError("error-login", data.message);
                    return;
                }

                window.location.href = "/view/action.html";
            } catch (err) {
                showError("error-login", "Errore di connessione al server");
            }
        }

        async function doRegister() {
            hideError("error-register");
            const email = document.getElementById("reg-email").value.trim();
            const password = document.getElementById("reg-password").value.trim();
            const password2 = document.getElementById("reg-password2").value.trim();

            if (!email || !password || !password2) {
                showError("error-register", "Compila tutti i campi");
                return;
            }

            if (password !== password2) {
                showError("error-register", "Le password non coincidono");
                return;
            }

            if (password.length < 6) {
                showError("error-register", "La password deve essere di almeno 6 caratteri");
                return;
            }

            try {
                const res = await fetch("/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!data.success) {
                    showError("error-register", data.message);
                    return;
                }

                window.location.href = "/view/action.html";
            } catch (err) {
                showError("error-register", "Errore di connessione al server");
            }
        }

        // Invio con tasto Enter
        document.addEventListener("keydown", (e) => {
            if (e.key !== "Enter") return;
            const loginActive = document.getElementById("section-login").classList.contains("active");
            if (loginActive) doLogin();
            else doRegister();
        });
    </script>
</body>

</html>
